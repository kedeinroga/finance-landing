name: security

# Security gate (secrets, dependencies, SAST). Called by the deploy workflow, where it blocks the
# deploy job, and also run weekly and on demand so new advisories surface without a commit.
# Exceptions live in the repo (see .github/scripts/security-gate.sh); they expire.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  security:
    name: Security gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      # Pinned versions, sha256 verified against the checksums the projects publish. No third-party
      # actions: the scanners run as plain binaries.
      - name: Install scanners
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/bin"
          mkdir -p "$BIN"
          cd "$RUNNER_TEMP"
          curl -sfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$BIN" gitleaks
          curl -sfL -o "$BIN/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64"
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $BIN/osv-scanner" | sha256sum -c -
          chmod +x "$BIN/osv-scanner"
          pipx install semgrep==1.178.0
          echo "$BIN" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Security gate
        run: .github/scripts/security-gate.sh package-lock.json
